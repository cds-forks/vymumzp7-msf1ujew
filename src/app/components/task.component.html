<section id="tasks">
  <header>
    <h2>{{ userName }}'s Tasks</h2>
    <menu>
      <button>Add Task</button>
    </menu>
  </header>
</section>
@if (taskDetail) {
<div class="task">
  <h3>
    {{ taskDetail.title }}
  </h3>
  <small> Due By {{ taskDetail.dueDate }}</small>
  <p>{{ taskDetail.summary }}</p>
  <p class="actions">
    <button>Complete the task</button>
  </p>
</div>
}
